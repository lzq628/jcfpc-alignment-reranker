[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jcfpc-alignment-reranker"
version = "0.1.0"
description = "Copyright-safe reference implementation of neural reranking for monotonic Japanese-Chinese alignment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
  "accelerate==1.10.1",
  "numpy==1.26.4",
  "peft==0.17.1",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
  "torch>=2.8",
  "transformers==4.57.6",
]
test = ["pytest>=8.0"]

[project.scripts]
jcfpc-demo = "jcfpc_alignment.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
