<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">JCFPC alignment reranker architecture</title>
  <desc id="desc">Private bilingual data becomes legal alignment candidates, receives BGE and Qwen scores, and is decoded by monotonic dynamic programming before aggregate evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#31566f"/>
    </marker>
    <style>
      .title{font:700 34px system-ui,sans-serif;fill:#173042}.sub{font:500 17px system-ui,sans-serif;fill:#506575}
      .head{font:700 21px system-ui,sans-serif;fill:#173042}.body{font:500 15px system-ui,sans-serif;fill:#3d5362}
      .small{font:600 13px system-ui,sans-serif;fill:#667b87}.box{stroke-width:2}.arrow{stroke:#31566f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f7fafb"/>
  <rect x="0" y="0" width="1200" height="108" fill="#173042"/>
  <text x="60" y="52" style="font:700 31px system-ui,sans-serif;fill:white">JCFPC Alignment Reranker</text>
  <text x="60" y="82" style="font:500 17px system-ui,sans-serif;fill:#cfe1e8">Neural translation evidence inside monotonic structured decoding</text>

  <rect x="42" y="142" width="220" height="178" rx="8" fill="#fff5db" stroke="#d49b21" class="box"/>
  <text x="65" y="180" class="head">Private data boundary</text>
  <text x="65" y="213" class="body">Licensed JA / ZH text</text>
  <text x="65" y="239" class="body">Silver alignment groups</text>
  <text x="65" y="265" class="body">Protected gold contexts</text>
  <rect x="65" y="282" width="150" height="23" rx="11" fill="#d49b21"/>
  <text x="81" y="299" style="font:700 12px system-ui,sans-serif;fill:white">NOT DISTRIBUTED</text>

  <path d="M262 231 H326" class="arrow"/>
  <rect x="330" y="142" width="230" height="178" rx="8" fill="#e7f1f7" stroke="#4381a3" class="box"/>
  <text x="353" y="180" class="head">Legal candidates</text>
  <text x="353" y="213" class="body">Fixed Japanese query</text>
  <text x="353" y="239" class="body">Positive + hard negatives</text>
  <text x="353" y="265" class="body">1:8–8:1 groups + gaps</text>
  <text x="353" y="296" class="small">Order-preserving search space</text>

  <path d="M560 197 H622" class="arrow"/>
  <path d="M560 266 H622" class="arrow"/>
  <rect x="626" y="130" width="235" height="103" rx="8" fill="#e8f6f1" stroke="#27846d" class="box"/>
  <text x="649" y="166" class="head">Qwen3 reranker</text>
  <text x="649" y="194" class="body">LoRA · listwise loss</text>
  <text x="649" y="217" class="small">Joint JA / ZH reading</text>
  <rect x="626" y="252" width="235" height="88" rx="8" fill="#edf2f5" stroke="#718894" class="box"/>
  <text x="649" y="288" class="head">Frozen BGE-M3</text>
  <text x="649" y="316" class="body">Cosine baseline</text>

  <path d="M861 181 H916 V227" class="arrow"/>
  <path d="M861 296 H916 V252" class="arrow"/>
  <rect x="920" y="159" width="238" height="162" rx="8" fill="#eaf5f7" stroke="#297c8c" class="box"/>
  <text x="943" y="198" class="head">Monotonic DP</text>
  <text x="943" y="230" class="body">Length + move penalties</text>
  <text x="943" y="256" class="body">Semantic candidate score</text>
  <text x="943" y="282" class="body">Global coverage and order</text>
  <text x="943" y="307" class="small">Same decoder for all scorers</text>

  <path d="M1039 321 V386" class="arrow"/>
  <rect x="692" y="390" width="466" height="166" rx="8" fill="#ffffff" stroke="#31566f" class="box"/>
  <text x="720" y="431" class="head">Frozen human-gold evaluation</text>
  <text x="720" y="464" class="body">20 representative contexts · 193 gold units</text>
  <text x="720" y="492" class="body">Exact Unit F1 · source exact · target IoU</text>
  <rect x="720" y="513" width="404" height="27" rx="5" fill="#173042"/>
  <text x="738" y="532" style="font:700 14px system-ui,sans-serif;fill:white">BGE 70.22%  →  fine-tuned Qwen 76.32%  (+6.10 pt)</text>

  <rect x="42" y="378" width="572" height="178" rx="8" fill="#ffffff" stroke="#b7c8d0" class="box"/>
  <text x="66" y="418" class="head">Public repository</text>
  <text x="66" y="451" class="body">DP · metrics · LoRA training · inference</text>
  <text x="66" y="479" class="body">Synthetic demo · aggregate results · CI</text>
  <text x="66" y="507" class="body">No novel text · no annotations · no weights</text>
  <text x="66" y="536" class="small">Method transparency without redistributing copyrighted content</text>

  <text x="42" y="617" class="sub">JCFPC method release · Japanese README by default · English documentation included</text>
</svg>
