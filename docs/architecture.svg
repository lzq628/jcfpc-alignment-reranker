<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">JCFPC alignment reranker architecture</title>
  <desc id="desc">Private bilingual data becomes legal alignment candidates, receives BGE and Qwen scores, and is decoded by monotonic dynamic programming before aggregate evaluation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#31566f"/>
    </marker>
    <style>
      .head{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:19px;font-weight:700;fill:#173042}
      .body{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:500;fill:#3d5362}
      .small{font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:600;fill:#667b87}
      .box{stroke-width:2}.arrow{stroke:#31566f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="590" fill="#f7fafb"/>
  <rect x="0" y="0" width="1200" height="108" fill="#173042"/>
  <text x="60" y="52" style="font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:31px;font-weight:700;fill:white">JCFPC Alignment Reranker</text>
  <text x="60" y="82" style="font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:17px;font-weight:500;fill:#cfe1e8">Neural translation evidence inside monotonic structured decoding</text>

  <rect x="42" y="140" width="245" height="195" rx="8" fill="#fff5db" stroke="#d49b21" class="box"/>
  <text x="64" y="178" class="head">Private data</text>
  <text x="64" y="211" class="body">Licensed JA / ZH text</text>
  <text x="64" y="238" class="body">Silver alignment groups</text>
  <text x="64" y="265" class="body">Protected gold contexts</text>
  <rect x="64" y="291" width="150" height="24" rx="12" fill="#d49b21"/>
  <text x="80" y="308" style="font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:12px;font-weight:700;fill:white">NOT DISTRIBUTED</text>

  <path d="M287 237 H321" class="arrow"/>
  <rect x="325" y="140" width="250" height="195" rx="8" fill="#e7f1f7" stroke="#4381a3" class="box"/>
  <text x="348" y="178" class="head">Legal candidates</text>
  <text x="348" y="211" class="body">Fixed Japanese query</text>
  <text x="348" y="238" class="body">Positive + hard negatives</text>
  <text x="348" y="265" class="body">1:8–8:1 groups + gaps</text>
  <text x="348" y="305" class="small">Monotonic candidate space</text>

  <path d="M575 190 H621" class="arrow"/>
  <path d="M575 285 H621" class="arrow"/>
  <rect x="625" y="130" width="235" height="105" rx="8" fill="#e8f6f1" stroke="#27846d" class="box"/>
  <text x="648" y="166" class="head">Qwen3 reranker</text>
  <text x="648" y="194" class="body">LoRA · listwise loss</text>
  <text x="648" y="217" class="small">Joint JA / ZH reading</text>
  <rect x="625" y="250" width="235" height="90" rx="8" fill="#edf2f5" stroke="#718894" class="box"/>
  <text x="648" y="286" class="head">Frozen BGE-M3</text>
  <text x="648" y="314" class="body">Cosine baseline</text>

  <path d="M860 182 H906" class="arrow"/>
  <path d="M860 295 H906" class="arrow"/>
  <rect x="910" y="130" width="248" height="210" rx="8" fill="#eaf5f7" stroke="#297c8c" class="box"/>
  <text x="934" y="170" class="head">Monotonic DP</text>
  <text x="934" y="206" class="body">Length + move penalties</text>
  <text x="934" y="235" class="body">Semantic candidate score</text>
  <text x="934" y="264" class="body">Global coverage and order</text>
  <text x="934" y="304" class="small">Same decoder for all scorers</text>

  <path d="M1034 340 V382" class="arrow"/>
  <rect x="690" y="386" width="468" height="166" rx="8" fill="#ffffff" stroke="#31566f" class="box"/>
  <text x="718" y="427" class="head">Frozen human-gold evaluation</text>
  <text x="718" y="460" class="body">20 representative contexts · 193 gold units</text>
  <text x="718" y="488" class="body">Exact Unit F1 · source exact · target IoU</text>
  <rect x="718" y="509" width="406" height="28" rx="5" fill="#173042"/>
  <text x="736" y="528" style="font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:14px;font-weight:700;fill:white">BGE 70.22%  →  fine-tuned Qwen 76.32%  (+6.10 pt)</text>

  <rect x="42" y="386" width="570" height="166" rx="8" fill="#ffffff" stroke="#b7c8d0" class="box"/>
  <text x="66" y="427" class="head">Public repository</text>
  <text x="66" y="460" class="body">DP · metrics · LoRA training · inference</text>
  <text x="66" y="488" class="body">Synthetic demo · aggregate results · CI</text>
  <text x="66" y="516" class="body">No novel text · no annotations · no weights</text>
  <text x="66" y="538" class="small">Public method, private copyrighted content</text>
</svg>
